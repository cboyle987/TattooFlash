# Standalone server stack. Do not merge with docker-compose.yml.
# Use project tattooflash-staging or tattooflash-production and a separate env file.
services:
  tattooflash.web:
    image: ghcr.io/cboyle987/tattooflash:${RELEASE_VERSION:?Set RELEASE_VERSION}
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:?Set Staging or Production}"
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=tattooflash;Username=tattooflash_user;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      Auth0__Domain: "${AUTH0_DOMAIN:?Set AUTH0_DOMAIN}"
      Auth0__ClientId: "${AUTH0_CLIENT_ID:?Set AUTH0_CLIENT_ID}"
      Auth0__ClientSecret: "${AUTH0_CLIENT_SECRET:?Set AUTH0_CLIENT_SECRET}"
      R2__AccessKeyId: "${R2_ACCESS_KEY_ID:?Set R2_ACCESS_KEY_ID}"
      R2__SecretAccessKey: "${R2_SECRET_ACCESS_KEY:?Set R2_SECRET_ACCESS_KEY}"
      R2__BucketName: "${R2_BUCKET_NAME:?Set R2_BUCKET_NAME}"
      R2__Prefix: designs
      R2__Endpoint: "${R2_ENDPOINT:?Set R2_ENDPOINT}"
      R2__PublicBaseUrl: "${R2_PUBLIC_BASE_URL:?Set R2_PUBLIC_BASE_URL}"
      Sentry__Dsn: "${SENTRY_DSN:?Set SENTRY_DSN}"
      Sentry__Environment: "${ASPNETCORE_ENVIRONMENT:?Set Staging or Production}"
    volumes:
      - dataprotection_keys:/var/lib/tattooflash/keys
    networks:
      proxy:
        aliases:
          - "${DEPLOYMENT_ENVIRONMENT:?Set staging or production}-web"
      database:
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: tattooflash
      POSTGRES_USER: tattooflash_user
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - database
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tattooflash_user", "-d", "tattooflash"]
    restart: unless-stopped

networks:
  proxy:
    external: true
    name: "tattooflash-${DEPLOYMENT_ENVIRONMENT:?Set staging or production}-proxy"
  database:

volumes:
  postgres_data:
  dataprotection_keys:
