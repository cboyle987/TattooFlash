services:
  tattooflash.web:
    image: ${DOCKER_REGISTRY-}tattooflashweb
    networks:
    - proxy
    build:
      context: .
      dockerfile: TattooFlash.Web/Dockerfile
  caddy:
    image: caddy:2.11.7
    ports:
    - "80:80"
    - "443:443"
    volumes:
    - ./Caddyfile:/etc/caddy/Caddyfile:ro
    - caddy_data:/data
    - caddy_config:/config 
    networks:
    - proxy
networks: 
  proxy: 
    ipam:
      config:
      - subnet: 172.30.10.0/24
volumes:
  caddy_data:
  caddy_config: