name: Build and Push Docker Image 
on: 
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'
jobs:
  test: 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET 
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore TattooFlash.slnx 
      - name: Build project
        run: dotnet build TattooFlash.Web/TattooFlash.Web.csproj --configuration Release --no-restore
      - name: Run tests 
        run: dotnet test TattooFlash.UnitTest/TattooFlash.UnitTest.csproj --configuration Release --no-restore
  build-and-push:
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Setup .NET 
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install dotnet ef tooling 
        run: dotnet tool install --global dotnet-ef --version 10.0.13
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/cboyle987/tattooflash
          tags: |
            type=semver,pattern={{version}}
          flavor: | 
            latest=false
      - name: Build ef migration bundle 
        env: 
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: | 
          dotnet ef migrations bundle \
          --project TattooFlash.Web/TattooFlash.Web.csproj \
          --startup-project TattooFlash.Web/TattooFlash.Web.csproj \
          --configuration Release \
          --self-contained \
          --target-runtime linux-x64 \
          --output "artifacts/efbundle-${RELEASE_VERSION}"
      - name: upload ef migration bundle 
        uses: actions/upload-artifact@v7
        with: 
          name: migrations-${{ steps.meta.outputs.version }}
          path: artifacts/efbundle-${{ steps.meta.outputs.version }}
          if-no-files-found: error
          retention-days: 7
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./TattooFlash.Web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
      