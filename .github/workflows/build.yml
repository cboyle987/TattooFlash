name: build-validation
on: 
  workflow_dispatch:
jobs:
  test: 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET 
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore TattooFlash.slnx 
      - name: Build project
        run: dotnet build TattooFlash.Web/TattooFlash.Web.csproj --configuration Release --no-restore
      - name: Run tests 
        run: dotnet test TattooFlash.UnitTest/TattooFlash.UnitTest.csproj --configuration Release --no-restore