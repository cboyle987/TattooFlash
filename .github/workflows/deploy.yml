name: Release Build and Deploy
on: 
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'
jobs:
  test: 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET 
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore TattooFlash.slnx 
      - name: Build project
        run: dotnet build TattooFlash.Web/TattooFlash.Web.csproj --configuration Release --no-restore
      - name: Run tests 
        run: dotnet test TattooFlash.UnitTest/TattooFlash.UnitTest.csproj --configuration Release --no-restore
  build-and-push:
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Setup .NET 
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install dotnet ef tooling 
        run: dotnet tool install --global dotnet-ef --version 10.0.13
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/cboyle987/tattooflash
          tags: |
            type=semver,pattern={{version}}
          flavor: | 
            latest=false
      - name: Restore application dependencies
        run: dotnet restore TattooFlash.Web/TattooFlash.Web.csproj
      - name: Build ef migration bundle 
        env: 
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: | 
          dotnet ef migrations bundle \
          --project TattooFlash.Web/TattooFlash.Web.csproj \
          --startup-project TattooFlash.Web/TattooFlash.Web.csproj \
          --configuration Release \
          --self-contained \
          --target-runtime linux-x64 \
          --output "artifacts/efbundle-${RELEASE_VERSION}"
      - name: upload ef migration bundle 
        uses: actions/upload-artifact@v7
        with: 
          name: migrations-${{ steps.meta.outputs.version }}
          path: artifacts/efbundle-${{ steps.meta.outputs.version }}
          if-no-files-found: error
          retention-days: 7
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./TattooFlash.Web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read 
      actions: read 
    concurrency: 
      group: staging-deploy
      cancel-in-progress: false
    steps:
      - name: Download migration bundle
        uses: actions/download-artifact@v8
        with:
          name: migrations-${{ needs.build-and-push.outputs.version }}
          path: artifacts
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.STAGING_KNOWN_HOSTS }}
          STAGING_HOST: ${{ vars.STAGING_HOST }}
          STAGING_USER: ${{ vars.STAGING_USER }}
        run: |
          set -euo pipefail
          : "${SSH_PRIVATE_KEY:?Missing SSH private key}"
          : "${SSH_KNOWN_HOSTS:?Missing known hosts}"
          : "${STAGING_HOST:?Missing staging host}"
          : "${STAGING_USER:?Missing staging user}"

          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/staging_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

          cat > "$HOME/.ssh/config" <<EOF
          Host staging
            HostName $STAGING_HOST
            User $STAGING_USER
            IdentityFile ~/.ssh/staging_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            HostKeyAlgorithms ssh-ed25519
            ConnectTimeout 10
          EOF
      - name: Verify deployment access
        env:
          RELEASE_VERSION: ${{ needs.build-and-push.outputs.version }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test -f "artifacts/efbundle-$RELEASE_VERSION"
          ssh -T staging \
            "sudo -n -l /usr/local/sbin/tattooflash-deploy staging $RELEASE_VERSION"
      - name: Upload migration bundle
        env:
          RELEASE_VERSION: ${{ needs.build-and-push.outputs.version }}
        run: |
          ssh -T staging "install -d -m 700 /home/deploy/tattooflash/staging"

          scp "artifacts/efbundle-$RELEASE_VERSION" \
            "staging:/home/deploy/tattooflash/staging/efbundle-$RELEASE_VERSION.upload"

          ssh -T staging \
            "mv /home/deploy/tattooflash/staging/efbundle-$RELEASE_VERSION.upload /home/deploy/tattooflash/staging/efbundle-$RELEASE_VERSION"

      - name: Deploy staging
        env:
          RELEASE_VERSION: ${{ needs.build-and-push.outputs.version }}
        run: |
          ssh -T staging \
            "sudo -n /usr/local/sbin/tattooflash-deploy staging $RELEASE_VERSION"

      - name: Remove SSH credentials
        if: always()
        run: |
          rm -f "$HOME/.ssh/staging_key" \
            "$HOME/.ssh/known_hosts" \
            "$HOME/.ssh/config"
